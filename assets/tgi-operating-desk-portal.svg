<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">TGI Operating Desk portal structure</title>
  <desc id="desc">An illustrative member portal with Current Desk, News and Releases, 43 instruments in four market groups, permanent instrument pages, Daily Zones, structural levels, market outlooks and conditional scenarios. No live prices or current analysis are shown.</desc>
  <defs>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#191913"/><stop offset="1" stop-color="#0d1010"/></linearGradient>
    <linearGradient id="gold" x2="1" y2="1"><stop stop-color="#d8b469"/><stop offset="1" stop-color="#a88132"/></linearGradient>
    <linearGradient id="zone" x2="0" y2="1"><stop stop-color="#c99a3d" stop-opacity=".22"/><stop offset="1" stop-color="#c99a3d" stop-opacity=".05"/></linearGradient>
  </defs>
  <rect width="1200" height="940" rx="20" fill="#0c0e0d"/>
