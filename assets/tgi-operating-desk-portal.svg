    <g fill="#e5dfd1" font-size="21"><text x="762" y="635">Daily Zones</text><text x="762" y="682">Structural levels</text><text x="762" y="729">Market outlooks</text><text x="762" y="776">Conditional scenarios</text></g>
    <g fill="#c99a3d"><circle cx="1094" cy="628" r="3"/><circle cx="1094" cy="675" r="3"/><circle cx="1094" cy="722" r="3"/><circle cx="1094" cy="769" r="3"/></g>
    <text x="600" y="901" text-anchor="middle" fill="#97998f" font-size="18">Illustrative navigation · No live prices or current analysis shown</text>
