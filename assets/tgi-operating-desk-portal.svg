    <text x="350" y="282" fill="#f2ede2" font-family="Georgia, serif" font-size="38">Current Desk</text>
    <text x="350" y="316" fill="#b8b6ac" font-size="20">43 instruments · Four market groups</text>
    <g stroke="#c99a3d" stroke-opacity=".28" fill="#111614">
