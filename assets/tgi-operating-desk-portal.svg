    <rect x="40" y="150" width="1120" height="707" rx="13" fill="url(#panel)" stroke="#c99a3d" stroke-opacity=".55"/>
    <path d="M53 150H1147Q1160 150 1160 163V220H40V163Q40 150 53 150Z" fill="#111610"/>
