    <text x="920" y="194" fill="#aaa69c" font-size="16">Structure preview</text>
    <path d="M315 220V857" stroke="#c99a3d" stroke-opacity=".23"/>
    <rect x="57" y="245" width="239" height="47" rx="5" fill="#c99a3d" fill-opacity=".16"/>
    <rect x="57" y="245" width="4" height="47" fill="#c99a3d"/>
    <g font-size="20" fill="#b8b6ac">
